<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeorMedTJ</title>
  <script>
    var ua = navigator.userAgent || navigator.vendor || window.opera;
    var androidUrl = "https://play.google.com/store/apps/details?id=tj.atsmu2.app&hl=ru";
    var iosUrl = "https://apps.apple.com/tj/app/teormedtj/id6756610215";

    // Автоматическое перенаправление в зависимости от устройства
    if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {
      window.location.replace(iosUrl);
    } else if (/android/i.test(ua)) {
      window.location.replace(androidUrl);
    }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #f0f7ff, #e2e8f0);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 20px;
      color: #1e293b;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 400px;
      padding: 36px 28px;
      border-radius: 24px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.08), 0 0 1px 1px rgba(0, 0, 0, 0.04);
      text-align: center;
    }
    .logo-img {
      width: 84px;
      height: 84px;
      border-radius: 20px;
      object-fit: cover;
      margin-bottom: 16px;
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.12);
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    p.subtitle {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 26px;
    }
    .spinner-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
      font-size: 13px;
      color: #94a3b8;
    }
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #cbd5e1;
      border-top-color: #007aff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .links-title {
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 14px 18px;
      margin-bottom: 12px;
      border-radius: 14px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .btn:hover {
      transform: translateY(-1px);
      opacity: 0.95;
    }
    .btn:active {
      transform: translateY(0);
    }
    .btn-apple {
      background: #000000;
      color: #ffffff;
    }
    .btn-google {
      background: #01875f;
      color: #ffffff;
    }
    .btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- Предполагается, что вы переименовали файл логотипа в logo.jpeg -->
    <img src="logo.jpeg" alt="TeorMedTJ" class="logo-img">
    <h1>TeorMedTJ</h1>
    <p class="subtitle">Медицина и современное образование</p>

    <div class="spinner-box">
      <div class="spinner"></div>
      <span>Автоматический переход в магазин...</span>
    </div>

    <div class="links-title">Или выберите вручную:</div>

    <a class="btn btn-apple" href="https://apps.apple.com/tj/app/teormedtj/id6756610215">
      <svg viewBox="0 0 24 24"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 4.54c.66-.8 1.11-1.92.99-3.04-1 .04-2.16.66-2.84 1.45-.6.69-1.12 1.81-.98 2.9 1.11.09 2.22-.57 2.83-1.31z"/></svg>
      Скачать в App Store
    </a>

    <a class="btn btn-google" href="https://play.google.com/store/apps/details?id=tj.atsmu2.app&hl=ru">
      <svg viewBox="0 0 24 24"><path d="M3 20.5v-17c0-.83.67-1.5 1.5-1.5.34 0 .67.11.95.33l13.12 8.5a1.5 1.5 0 0 1 0 2.34l-13.12 8.5c-.28.22-.61.33-.95.33-.83 0-1.5-.67-1.5-1.5zm11.3-8.5L4.5 5.75v9.5l9.8-6.25z"/></svg>
      Доступно в Google Play
    </a>
  </div>
</body>
</html>
